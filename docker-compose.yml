version: '3.9'
services:
  webserver:
    container_name: exhibition_system
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./www:/var/www/html
    ports:
      - 8000:80
    depends_on:
      - mysql-db
    networks:
      - ems_network

  mysql-db:
    image: mysql:8.0
    volumes:
      - ./db:/var/lib/mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: database
      MYSQL_USER: ubuntu
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    networks:
      - ems_network

  cronjob:
    container_name: ems_cron
    build:
      context: .
      dockerfile: cron/Dockerfile
    depends_on:
      - webserver
    networks:
      - ems_network

networks:
  ems_network:
    driver: bridge

volumes:
  db:
  www: