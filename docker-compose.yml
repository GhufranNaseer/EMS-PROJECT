version: '3.9'
services:
  webserver:
    container_name: exhibition_system
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./www:/var/www/html
    ports:
      - 8000:80
    depends_on:
      - mysql-db
    networks:
      - ems_network

  mysql-db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - ./db:/var/lib/mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "rUbfOA!WE8XjfyS5"
      MYSQL_DATABASE: ems_main_db1
      MYSQL_USER: ems_web_user
      MYSQL_PASSWORD: "EWEpYe3TJTTT@gKl"
    ports:
      - "3307:3306"
    networks:
      - ems_network

  cronjob:
    container_name: ems_cron
    build:
      context: .
      dockerfile: cron/Dockerfile
    depends_on:
      - webserver
    networks:
      - ems_network

  ems_qr_service:
    container_name: ems_qr_service
    build:
      context: .
      dockerfile: qr_service/Dockerfile
    ports:
      - "8001:8000"
    depends_on:
      - webserver
    networks:
      - ems_network

networks:
  ems_network:
    driver: bridge

volumes:
  db:
  www:
