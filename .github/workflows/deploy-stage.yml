name: Deploy Staging to VPS

on:
  push:
    branches:
      - developer

jobs:
  deploy:
    name: Deploy to Staging (Beta)
    runs-on: ubuntu-latest

    steps:
      - name: SSH into VPS and Pull Latest Staging Code
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            echo "🚀 Starting Staging Deployment (developer branch)..."
            
            # Navigate to Staging codebase directory
            cd /var/www/exhibition_system_stage
            
            # Pull latest changes from developer branch
            git pull origin developer
            
            # Ensure proper folder permissions for cache & uploads
            chmod -R 775 www/application/cache www/uploads || true
            
            # Execute Safe, Conflict-Free Database Migrations
            echo "🔄 Checking and executing database migrations on staging..."
            php db/migrate.php || true
            
            echo "✅ Staging Deployed Successfully!"
