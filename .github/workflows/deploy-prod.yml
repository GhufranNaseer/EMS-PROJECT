name: Deploy Production to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Live Production
    runs-on: ubuntu-latest

    steps:
      - name: SSH into VPS and Pull Latest Code
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            echo "🚀 Starting Production Deployment..."
            cd /var/www/exhibition_system_prod
            
            # Pull latest changes from main branch
            git pull origin main
            
            # Ensure proper folder permissions for cache & uploads
            chmod -R 775 www/application/cache www/uploads || true
            
            echo "✅ Production Deployed Successfully!"
